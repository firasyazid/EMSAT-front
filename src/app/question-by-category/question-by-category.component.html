<mat-card class="question-card" *ngFor="let question of questions | paginate: { itemsPerPage: 1, currentPage: p }; let i = index">
  <!-- Single Choice Question -->

  <div *ngIf="questions && questions.length === 0">
    No questions available.
  </div>
  
  <mat-card-content *ngIf="question.type === 'singleChoice'">
    <div class="col-sm-6 p-md-0">
      <div class="welcome-text">
        <p class="mb-0">Select one of the following choices</p>
      </div>
    </div>
    <h4>{{ (p - 1) * 1 + i + 1 }}. {{ question.text }}</h4>
    <section class="example-section">
      <mat-radio-group
        aria-label="Select an option"
        (change)="onSingleChoiceSelected(question.id || '', $event.value)">
        <mat-radio-button
          *ngFor="let option of question.singleChoiceData?.options"
          [value]="option"
          class="example-margin">
          {{ option }}
        </mat-radio-button>
      </mat-radio-group>
    </section>
  </mat-card-content>

  <!-- Multiple Choice Question -->
  <mat-card-content *ngIf="question.type === 'multipleChoice'">
    <div class="col-sm-6 p-md-0">
      <div class="welcome-text">
        <p class="mb-0">Select one or more of the following choices</p>
      </div>
    </div>
    <h4>{{ (p - 1) * 1 + i + 1 }}. {{ question.text }}</h4>
    <section class="example-section">
      <div *ngFor="let option of question.multipleChoiceData?.options">
        <mat-checkbox
          [checked]="isOptionSelected(question.id || '', option)"
          (change)="onMultipleChoiceSelectionChange(question.id || '', option)">
          {{ option }}
        </mat-checkbox>
      </div>
    </section>
  </mat-card-content>





  <mat-card-content *ngIf="question.type === 'dragAndDrop'">
    <div class="col-sm-6 p-md-0">
      <div class="welcome-text"></div>
    </div>
    <h4>{{ (p - 1) * 1 + i + 1 }}. {{ question.text }}</h4>
  
    <!-- Draggable items -->
    <div class="draggable-container" cdkDropListGroup>
      <div 
        class="draggable-items"
        cdkDropList 
        [cdkDropListData]="question.dragAndDropData?.draggableItems || []"
        (cdkDropListDropped)="drop($event)">
        <div 
          *ngFor="let item of question.dragAndDropData?.draggableItems || []; let i = index"
          class="draggable-item"
          cdkDrag>
          {{ item }}
        </div>
      </div>
    </div>
  
    <!-- Drop areas for sequence -->
    <div class="drop-area-container">
      <div
        class="drop-area"
        *ngFor="let part of correctSequence; let idx = index"
        cdkDropList
        [id]="dropListIds[idx]"  
        [cdkDropListData]="selectedItems || []"
        (cdkDropListDropped)="drop($event)"
        [innerHTML]="stripHtmlTags(part, idx)">
      </div>
    </div>
    
    

   </mat-card-content>
  
  







<pagination-controls (pageChange)="p = $event"></pagination-controls>

</mat-card>
